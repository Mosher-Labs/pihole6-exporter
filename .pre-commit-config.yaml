---
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
  # The upstream Docker hooks pull their images by tag (hadolint's pulls
  # :latest), so run the same images as local hooks pinned by digest.
  - repo: local
    hooks:
      - id: markdownlint-docker
        name: markdownlint
        language: docker_image
        types: [markdown]
        entry: ghcr.io/igorshubovych/markdownlint-cli:v0.50.0@sha256:db7dcb73cd3163cc45854b60fc21eefe1ebe7fa52aad758706010b64a4778900
      - id: actionlint-docker
        name: Lint GitHub Actions workflow files
        language: docker_image
        types: [yaml]
        files: ^\.github/workflows/
        entry: docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        types: [dockerfile]
        entry: ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  # Keeps the revs above current and frozen to commit SHAs. Checks at most once
  # a day, and only takes releases that are at least a week old.
  - repo: https://github.com/mosher-labs/pre-commit-autoupdate
    rev: 3be8bbd6c69bcf775d15ec32213b779b82bfacb3  # frozen: v1.2.11
    hooks:
      - id: autoupdate
        args: [--freeze, --interval-hours, "24", --min-age-days, "7"]
